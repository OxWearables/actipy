[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["setuptools>=43.0.0", "wheel", "tomli"]
build-backend = "setuptools.build_meta"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/actipy/_version.py"
versionfile_build = "actipy/_version.py"
tag_prefix = "v"
parentdir_prefix = "actipy-"

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = ["venv"]

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle imports
    "E7",   # pycodestyle statements
    "E9",   # pycodestyle runtime errors
    "F",    # Pyflakes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "I",    # isort
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.8"
files = ["src/actipy"]
exclude = ["src/actipy/_version.py"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "scipy",
    "scipy.*",
    "statsmodels",
    "statsmodels.*",
    "tqdm",
    "tqdm.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["actipy._version"]
ignore_errors = true
